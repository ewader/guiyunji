# 今日一字 · 字课
# 结构：zi 字 / py 拼音 / shi 字源 / yi 释义 / ju 用例 / chu 出处
# 按「一年中的第几天」轮换，同日同字，人我一如

- zi: 雲
  py: yún
  shi: 初文作「云」，象云气回旋之形；后加雨为「雲」，从雨、云声。
  yi: 山川之气蒸腾而上，聚而为云。古人观云以知雨，云色即天时。
  ju: 山中何所有，岭上多白云。
  chu: 陶弘景《诏问山中何所有赋诗以答》

- zi: 山
  py: shān
  shi: 象形。三峰并峙，中高旁低。
  yi: 地面高起之处。古人以山为骨，五岳各镇一方，山即疆土之界。
  ju: 空山不见人，但闻人语响。
  chu: 王维《鹿柴》

- zi: 水
  py: shuǐ
  shi: 象形。中为水流，两旁为岸，四点如浪。
  yi: 河流。引申为一切润下之物，与火相对，为五行之首。
  ju: 上善若水，水善利万物而不争。
  chu: 《老子·第八章》

- zi: 木
  py: mù
  shi: 象形。上出者为枝，下入者为根，一竖为干。
  yi: 树。五行之一，主生发；引申为质朴、木讷。
  ju: 伐木丁丁，鸟鸣嘤嘤。
  chu: 《诗经·小雅·伐木》

- zi: 竹
  py: zhú
  shi: 象形。两竿并生，叶垂而下，形如「个」字。
  yi: 竹子。中空有节，故君子取之：虚其心，守其节。
  ju: 宁可食无肉，不可居无竹。
  chu: 苏轼《于潜僧绿筠轩》

- zi: 茶
  py: chá
  shi: 本作「荼」，唐时减一笔为「茶」。从艸，余声。
  yi: 茶树。自陆羽著经，饮茶由药入道，成一门生活之学。
  ju: 茶者，南方之嘉木也。
  chu: 陆羽《茶经·一之源》

- zi: 書
  py: shū
  shi: 从聿从者。聿，手执笔也；者，声兼义。
  yi: 书写；又指所写之册。字在竹帛为书，在纸为卷。
  ju: 读书破万卷，下笔如有神。
  chu: 杜甫《奉赠韦左丞丈二十二韵》

- zi: 墨
  py: mò
  shi: 会意。从黑、从土——以土之烟炱为黑，和胶成块。
  yi: 书写绘画的黑色颜料。墨分五色，浓淡干湿焦，一墨可当七彩。
  ju: 宋元君将画图，众史皆至，受揖而立，舐笔和墨。
  chu: 《庄子·田子方》

- zi: 紙
  py: zhǐ
  shi: 从糸，氏声。本指漂洗丝絮时沉于竹席上的絮渣，故从糸。
  yi: 蔡伦以树肤、麻头、敝布、鱼网造纸，自此竹帛让位，文脉得以广传。
  ju: 于是豪贵之家竞相传写，洛阳为之纸贵。
  chu: 《晋书·左思传》

- zi: 琴
  py: qín
  shi: 象形兼形声。上象弦轸，下象琴身。本作「琹」。
  yi: 七弦之器。古人以琴正心，非为娱人，乃为娱己。
  ju: 窈窕淑女，琴瑟友之。
  chu: 《诗经·周南·关雎》

- zi: 春
  py: chūn
  shi: 会意。从艸、从日、从屯——日暖草生，屯然破土。
  yi: 四时之首。春者，蠢也，万物蠢动而出。
  ju: 春日载阳，有鸣仓庚。
  chu: 《诗经·豳风·七月》

- zi: 秋
  py: qiū
  shi: 象形。上为禾穗下垂，下为根，本指谷熟。
  yi: 谷熟曰秋，故秋为收成之季；又引申为年岁、为肃杀。
  ju: 自古逢秋悲寂寥，我言秋日胜春朝。
  chu: 刘禹锡《秋词》

- zi: 月
  py: yuè
  shi: 象形。象缺月之形，中一笔为月魄。
  yi: 月亮。月有盈亏，故古人以月纪时，朔望晦弦，一月之序生焉。
  ju: 明月松间照，清泉石上流。
  chu: 王维《山居秋暝》

- zi: 雪
  py: xuě
  shi: 从雨，彗声。凝雨而为花者——雨之下，遇寒则结。
  yi: 空中降下的雪花。雪能覆物，亦能照夜，故文人多取其为清绝之象。
  ju: 孤舟蓑笠翁，独钓寒江雪。
  chu: 柳宗元《江雪》

- zi: 風
  py: fēng
  shi: 从虫，凡声。古人谓风动虫生，故字从虫。
  yi: 空气流行。风有八方，各以其时，古人候风以定农事、辨吉凶。
  ju: 风雨如晦，鸡鸣不已。
  chu: 《诗经·郑风·风雨》

- zi: 花
  py: huā
  shi: 从艸，化声。六朝以前多作「華」，花为后起之本字。
  yi: 草木之花。华而后实，故花为草木之盛，亦为人事之盛。
  ju: 云想衣裳花想容，春风拂槛露华浓。
  chu: 李白《清平调》

- zi: 石
  py: shí
  shi: 象形。厂为山崖，口为崖下之石。
  yi: 岩石。石为山之骨，可为砚、为碑、为印，文人之事多赖之。
  ju: 乱石穿空，惊涛拍岸，卷起千堆雪。
  chu: 苏轼《念奴娇·赤壁怀古》

- zi: 心
  py: xīn
  shi: 象形。象心脏之形，中一点为心房。
  yi: 心为思之官。古人以心统性情，故一切念头皆自心出。
  ju: 心之官则思，思则得之，不思则不得也。
  chu: 《孟子·告子上》

- zi: 靜
  py: jìng
  shi: 从青，争声。青为东方之色，主生而含静气。
  yi: 安静、止息。静非无声，乃心不随声转。
  ju: 蝉噪林逾静，鸟鸣山更幽。
  chu: 王籍《入若耶溪》

- zi: 和
  py: hé
  shi: 从口，禾声。口相应曰和，如歌者相答。
  yi: 声音相和；引申为调和、平和。五味相济曰和，五声相谐亦曰和。
  ju: 礼之用，和为贵。
  chu: 《论语·学而》

- zi: 中
  py: zhōng
  shi: 象形。象旗杆立于中，上下有旒，以表中央。
  yi: 中间、中正。不偏不倚之谓中，故《中庸》以中为天下之达道。
  ju: 人心惟危，道心惟微，惟精惟一，允执厥中。
  chu: 《尚书·大禹谟》

- zi: 道
  py: dào
  shi: 从辵、从首。辵为行走，首为所向——人所由之路。
  yi: 道路；引申为道理、规律。路有定迹，道无定形，故曰「道可道，非常道」。
  ju: 道可道，非常道；名可名，非常名。
  chu: 《老子·第一章》

- zi: 時
  py: shí
  shi: 从日，寺声。日之行而有四时，故字从日。
  yi: 季节、时辰。时为天之所命，故君子「时至而事起」。
  ju: 学而时习之，不亦说乎。
  chu: 《论语·学而》

- zi: 節
  py: jié
  shi: 从竹，即声。竹约曰节——竹中空而外有节，分段而生。
  yi: 竹节；引申为节令、节度。二十四节气之名，即取竹节分段之义。
  ju: 节以制度，不伤财，不害民。
  chu: 《周易·节卦·彖传》

# ── 天象山川 ─────────────────────────────────────────────
- zi: 日
  py: rì
  shi: 象形。外框象日轮，中一点为日中之精。
  yi: 太阳；又为一日之计量。日为阳之宗，古人以日主生养。
  ju: 日出而作，日入而息。
  chu: 《击壤歌》

- zi: 星
  py: xīng
  shi: 形声。从晶，生声——晶即众星之形。
  yi: 星辰。古人分星野以配地理，观星以授农时。
  ju: 星汉灿烂，若出其里。
  chu: 曹操《观沧海》

- zi: 露
  py: lù
  shi: 从雨，路声。
  yi: 夜半水气凝于草木者。露易晞，故诗家以喻短暂与清寒。
  ju: 露从今夜白，月是故乡明。
  chu: 杜甫《月夜忆舍弟》

- zi: 霜
  py: shuāng
  shi: 从雨，相声。
  yi: 露遇寒而结为霜。霜降而草木黄落，故霜为肃杀之候。
  ju: 停车坐爱枫林晚，霜叶红于二月花。
  chu: 杜牧《山行》

- zi: 雨
  py: yǔ
  shi: 象形。上为天，下数点为雨滴下落。
  yi: 云中降下的水。及时曰甘霖，过则成灾，故古人既祈且惧。
  ju: 好雨知时节，当春乃发生。
  chu: 杜甫《春夜喜雨》

- zi: 川
  py: chuān
  shi: 象形。象水流贯地之形，两旁为岸。
  yi: 河流。川流不息，故以川喻逝去的时光。
  ju: 子在川上曰：逝者如斯夫，不舍昼夜。
  chu: 《论语·子罕》

- zi: 海
  py: hǎi
  shi: 从水，每声。
  yi: 众水所归曰海。古人以海为天下之大，故有「海内」「四海」之称。
  ju: 海内存知己，天涯若比邻。
  chu: 王勃《送杜少府之任蜀州》

- zi: 泉
  py: quán
  shi: 象形。象水自穴中流出。
  yi: 地下水涌出者。泉为水之源，故有「源泉」「泉下」之语。
  ju: 泉眼无声惜细流，树阴照水爱晴柔。
  chu: 杨万里《小池》

- zi: 火
  py: huǒ
  shi: 象形。象火焰上腾，两旁为迸出的星火。
  yi: 火。五行之一，主炎上。古人取火有时，改火以应节。
  ju: 野火烧不尽，春风吹又生。
  chu: 白居易《赋得古原草送别》

- zi: 土
  py: tǔ
  shi: 象形。象地上隆起的土块。
  yi: 泥土。土为万物之母，五行居中；社稷之「社」即土神。
  ju: 土反其宅，水归其壑。
  chu: 《礼记·郊特牲》伊耆氏蜡辞

# ── 草木花果 ─────────────────────────────────────────────
- zi: 草
  py: cǎo
  shi: 从艸，早声。初文作「艸」，后加早为「草」。
  yi: 草本植物。草蔓生易长，故「草民」「草稿」皆取粗率之意。
  ju: 天街小雨润如酥，草色遥看近却无。
  chu: 韩愈《早春呈水部张十八员外》

- zi: 松
  py: sōng
  shi: 从木，公声。
  yi: 松树。松耐寒不凋，与柏并称，为岁寒之节。
  ju: 岁寒，然后知松柏之后凋也。
  chu: 《论语·子罕》

- zi: 梅
  py: méi
  shi: 从木，每声。
  yi: 梅树。梅先春而花，为报春之信；梅子可调羹，古以喻相业。
  ju: 疏影横斜水清浅，暗香浮动月黄昏。
  chu: 林逋《山园小梅》

- zi: 蘭
  py: lán
  shi: 从艸，闌声。
  yi: 兰草，香草。兰生幽谷，不以无人而不芳，故君子佩之。
  ju: 余既滋兰之九畹兮，又树蕙之百亩。
  chu: 屈原《离骚》

- zi: 菊
  py: jú
  shi: 从艸，匊声。「匊」为手掬，花形如掬。
  yi: 菊花。菊开于霜后，故为隐逸与晚节之象。
  ju: 采菊东篱下，悠然见南山。
  chu: 陶渊明《饮酒·其五》

- zi: 荷
  py: hé
  shi: 从艸，何声。
  yi: 莲。荷花出淤泥而不染，释家以莲为清净之喻。
  ju: 出淤泥而不染，濯清涟而不妖。
  chu: 周敦颐《爱莲说》

- zi: 柳
  py: liǔ
  shi: 从木，卯声。
  yi: 柳树。柳条柔垂，折柳赠别，自汉唐已然。
  ju: 昔我往矣，杨柳依依。
  chu: 《诗经·小雅·采薇》

- zi: 桃
  py: táo
  shi: 从木，兆声。
  yi: 桃树。桃木辟邪，桃花喻美人；《桃夭》一诗，为嫁娶之祝。
  ju: 桃之夭夭，灼灼其华。
  chu: 《诗经·周南·桃夭》

- zi: 葉
  py: yè
  shi: 从艸，枼声。枼即木上之叶。
  yi: 树叶。一叶知秋，叶落归根，皆以叶观时、观归。
  ju: 无边落木萧萧下，不尽长江滚滚来。
  chu: 杜甫《登高》

- zi: 苔
  py: tái
  shi: 从艸，台声。
  yi: 苔藓。苔生幽处，故诗人以苔写静、写荒。
  ju: 苔痕上阶绿，草色入帘青。
  chu: 刘禹锡《陋室铭》

# ── 鸟兽虫鱼 ─────────────────────────────────────────────
- zi: 鳥
  py: niǎo
  shi: 象形。象鸟侧立，有喙有翼有爪。
  yi: 鸟。鸟鸣应候，古人以鸟之来去辨节令。
  ju: 感时花溅泪，恨别鸟惊心。
  chu: 杜甫《春望》

- zi: 魚
  py: yú
  shi: 象形。上为头，中为身，下为尾。
  yi: 鱼。鱼生于水，古以鱼为丰饶之征，又以鱼腹藏书为信之喻。
  ju: 鱼戏莲叶间。
  chu: 汉乐府《江南》

- zi: 鶴
  py: hè
  shi: 从鸟，隺声。
  yi: 鹤。鹤寿千年，为长寿之象；形清瘦，又以比德君子。
  ju: 鹤鸣于九皋，声闻于天。
  chu: 《诗经·小雅·鹤鸣》

- zi: 鹿
  py: lù
  shi: 象形。象鹿角枝出、四足之形。
  yi: 鹿。鹿性温驯，古以「逐鹿」喻争天下。
  ju: 呦呦鹿鸣，食野之苹。
  chu: 《诗经·小雅·鹿鸣》

- zi: 馬
  py: mǎ
  shi: 象形。象马首、马鬃与四足。
  yi: 马。马为六畜之首，古人以马力计国势。
  ju: 老骥伏枥，志在千里。
  chu: 曹操《龟虽寿》

- zi: 蟬
  py: chán
  shi: 从虫，單声。
  yi: 蝉。蝉饮露而鸣，古以喻高洁；其蜕又喻再生。
  ju: 居高声自远，非是藉秋风。
  chu: 虞世南《蝉》

# ── 文房器物 ─────────────────────────────────────────────
- zi: 筆
  py: bǐ
  shi: 从竹从聿。聿为手执笔之形，竹为笔管。
  yi: 书写之器。竹管兔毫之制，沿用了两千年。
  ju: 梦一丈夫自称郭璞，谓淹曰：吾有笔在卿处多年，可以见还。
  chu: 《南史·江淹传》

- zi: 硯
  py: yàn
  shi: 从石，見声。
  yi: 研墨之石。端、歙为贵，石质温润，发墨而不损毫。
  ju: 天大寒，砚冰坚，手指不可屈伸。
  chu: 宋濂《送东阳马生序》

- zi: 卷
  py: juàn
  shi: 从卩（跪跽之形），上为声符。本义为膝曲，借为书卷之卷。
  yi: 书卷。古书以帛为卷，一卷即一轴。
  ju: 却看妻子愁何在，漫卷诗书喜欲狂。
  chu: 杜甫《闻官军收河南河北》

- zi: 扇
  py: shàn
  shi: 从户从羽。本义为门扉，引申为引风之具。
  yi: 扇。团扇多为宫怨之物，折扇则为文人之佩。
  ju: 银烛秋光冷画屏，轻罗小扇扑流萤。
  chu: 杜牧《秋夕》

- zi: 燈
  py: dēng
  shi: 从火，登声。古作「镫」，本指灯盏。
  yi: 灯火。灯为夜之明，上元张灯，遂成节俗。
  ju: 有约不来过夜半，闲敲棋子落灯花。
  chu: 赵师秀《约客》

- zi: 舟
  py: zhōu
  shi: 象形。中为舱，两旁为舷。
  yi: 船。舟行水上，古以「舟楫之利」论通商之便。
  ju: 两岸猿声啼不住，轻舟已过万重山。
  chu: 李白《早发白帝城》

- zi: 橋
  py: qiáo
  shi: 从木，喬声。木言其材，喬言其高。
  yi: 桥梁。桥通两岸，古为送别、相会之地。
  ju: 二十四桥明月夜，玉人何处教吹箫。
  chu: 杜牧《寄扬州韩绰判官》

- zi: 鼎
  py: dǐng
  shi: 象形。象三足两耳之器。
  yi: 三足两耳之器。鼎为国之重器，故「问鼎」即觊觎天下。
  ju: 楚子问鼎之大小轻重焉。
  chu: 《左传·宣公三年》

# ── 人文心性 ─────────────────────────────────────────────
- zi: 禮
  py: lǐ
  shi: 从示从豊。示为祭神，豊为祭器。
  yi: 祭神之仪；引申为一切制度规范。礼者，履也，所行之路。
  ju: 不学礼，无以立。
  chu: 《论语·季氏》

- zi: 樂
  py: yuè
  shi: 象形。上象鼓形，下象木架，为五声八音之总名。
  yi: 音乐；又读 lè，为喜乐。乐者，天地之和。
  ju: 兴于诗，立于礼，成于乐。
  chu: 《论语·泰伯》

- zi: 仁
  py: rén
  shi: 从人从二。二者，人与人相接。
  yi: 亲爱他人。仁为儒门总纲，其要在「爱人」。
  ju: 樊迟问仁。子曰：爱人。
  chu: 《论语·颜渊》

- zi: 學
  py: xué
  shi: 从教省，从冖从子。冖为蒙覆，子为童子。
  yi: 效法、求学。学之为言效也，故「学」与「教」同源。
  ju: 学而不思则罔，思而不学则殆。
  chu: 《论语·为政》

- zi: 師
  py: shī
  shi: 会意。左为「帀」，环绕之意；右为屯聚之本字，合指军旅驻止。
  yi: 师者，教人者也。师严而后道尊。
  ju: 三人行，必有我师焉。
  chu: 《论语·述而》

- zi: 友
  py: yǒu
  shi: 从二又。又为手，二手相交为友。
  yi: 朋友。同志曰友，同门曰朋。
  ju: 君子以文会友，以友辅仁。
  chu: 《论语·颜渊》

- zi: 家
  py: jiā
  shi: 从宀从豕。屋下有豕，为定居畜养之象。
  yi: 家庭。上古以畜豕为家，故家字从豕。
  ju: 烽火连三月，家书抵万金。
  chu: 杜甫《春望》

- zi: 夢
  py: mèng
  shi: 从夕，瞢省声。夕为夜。
  yi: 梦。梦为魂交，周礼有占梦之官。
  ju: 庄生晓梦迷蝴蝶，望帝春心托杜鹃。
  chu: 李商隐《锦瑟》

# ── 岁月晨昏 ─────────────────────────────────────────────
- zi: 夏
  py: xià
  shi: 象形。象人正面之形，本指中土之人。
  yi: 季节；又指华夏。夏为大，故以名四时之盛，亦以名中国之人。
  ju: 四月维夏，六月徂暑。
  chu: 《诗经·小雅·四月》

- zi: 冬
  py: dōng
  shi: 从冰，夂声。夂象绳之两端有结，取「终」义。
  yi: 冬。冬者终也，万物收藏。
  ju: 北风其喈，雨雪其霏。
  chu: 《诗经·邶风·北风》

- zi: 晨
  py: chén
  shi: 从日，辰声。
  yi: 早晨。晨为日之始，古人以「晨昏定省」为孝之常。
  ju: 盛年不重来，一日难再晨。
  chu: 陶渊明《杂诗》

- zi: 暮
  py: mù
  shi: 从日，莫声。「莫」本即日入草中之形。
  yi: 傍晚。暮为日之终，故诗家以暮写迟暮。
  ju: 日暮乡关何处是，烟波江上使人愁。
  chu: 崔颢《黄鹤楼》

- zi: 歲
  py: suì
  shi: 从步从戌。本指岁星（木星），十二年一周天。
  yi: 年岁。古人以岁星纪年，故年曰岁。
  ju: 岁月不居，时节如流。
  chu: 孔融《论盛孝章书》

- zi: 年
  py: nián
  shi: 从禾，千声。禾熟一次为一年。
  yi: 收成；引申为年岁。五谷皆熟为有年。
  ju: 五谷皆熟，为有年也。
  chu: 《谷梁传·桓公三年》

# ── 文事 ─────────────────────────────────────────────────
- zi: 詩
  py: shī
  shi: 从言，寺声。
  yi: 有韵之文。在心为志，发言为诗。
  ju: 诗言志，歌永言，声依永，律和声。
  chu: 《尚书·舜典》

- zi: 詞
  py: cí
  shi: 从言，司声。本指语助之辞，后借为文体之名。
  yi: 词。起于唐之燕乐，盛于两宋，句长短而有定谱。
  ju: 一曲新词酒一杯，去年天气旧亭台。
  chu: 晏殊《浣溪沙》

- zi: 畫
  py: huà
  shi: 从田从聿。聿为笔，田为界，以笔分界曰画。
  yi: 绘画；又为划分。画者，画也，以笔墨写胸中之象。
  ju: 味摩诘之诗，诗中有画；观摩诘之画，画中有诗。
  chu: 苏轼《书摩诘蓝田烟雨图》

- zi: 印
  py: yìn
  shi: 会意。从爪从卩，以手按人，本义为按压。
  yi: 印章。古以印为信，官印曰印，私印曰章。
  ju: 印，执政所持信也。
  chu: 《说文解字》

- zi: 弈
  py: yì
  shi: 从廾从亦。廾为两手，示对局之状。
  yi: 下棋。弈指围棋，博指六博，二者古有别。
  ju: 弈者举棋不定，不胜其耦。
  chu: 《左传·襄公二十五年》

# ── 花木 ─────────────────────────────────────────────────
- zi: 桂
  py: guì
  shi: 从木，圭声。
  yi: 桂树。桂香清远，又「折桂」喻登科。
  ju: 桂子月中落，天香云外飘。
  chu: 宋之问《灵隐寺》

- zi: 蓮
  py: lián
  shi: 从艸，連声。
  yi: 莲。莲实曰菂，莲根曰藕，一物而四时可用。
  ju: 接天莲叶无穷碧，映日荷花别样红。
  chu: 杨万里《晓出净慈寺送林子方》

- zi: 芝
  py: zhī
  shi: 从艸，之声。本指灵芝，神木所化。
  yi: 灵芝；又借指才俊。芝兰并举，言子弟之秀。
  ju: 譬如芝兰玉树，欲使其生于庭阶耳。
  chu: 《世说新语·言语》

- zi: 藤
  py: téng
  shi: 从艸，滕声。
  yi: 蔓生植物。藤附木而行，故有「攀藤附葛」之喻。
  ju: 枯藤老树昏鸦，小桥流水人家。
  chu: 马致远《天净沙·秋思》

- zi: 蕉
  py: jiāo
  shi: 从艸，焦声。
  yi: 芭蕉。叶大而易碎，雨打有声，故多入诗。
  ju: 红了樱桃，绿了芭蕉。
  chu: 蒋捷《一剪梅·舟过吴江》

- zi: 梧
  py: wú
  shi: 从木，吾声。
  yi: 梧桐。梧叶知秋，古以梧桐栖凤，为高洁之木。
  ju: 梧桐更兼细雨，到黄昏、点点滴滴。
  chu: 李清照《声声慢》

- zi: 楓
  py: fēng
  shi: 从木，風声。
  yi: 枫树。枫叶遇霜而丹，故为秋色之最。
  ju: 月落乌啼霜满天，江枫渔火对愁眠。
  chu: 张继《枫桥夜泊》

# ── 山川水泽 ─────────────────────────────────────────────
- zi: 溪
  py: xī
  shi: 从水，奚声。
  yi: 山间小水。溪声可听，故诗人多以溪写幽。
  ju: 梅子黄时日日晴，小溪泛尽却山行。
  chu: 曾几《三衢道中》

- zi: 潭
  py: tán
  shi: 从水，覃声。
  yi: 深水。潭静而深，古以喻人心之不可测。
  ju: 桃花潭水深千尺，不及汪伦送我情。
  chu: 李白《赠汪伦》

- zi: 洲
  py: zhōu
  shi: 从水，州声。水中可居者曰洲。
  yi: 水中小块陆地。
  ju: 关关雎鸠，在河之洲。
  chu: 《诗经·周南·关雎》

- zi: 岸
  py: àn
  shi: 从山从厂，干声。厂为崖，山为高。
  yi: 水边高地。岸为水之界，故「回头是岸」以喻止步。
  ju: 潮平两岸阔，风正一帆悬。
  chu: 王湾《次北固山下》

- zi: 潮
  py: cháo
  shi: 从水，朝声。潮以朝夕而至，故从朝。
  yi: 潮汐。月引力使水涨落，古已知其应月。
  ju: 春江潮水连海平，海上明月共潮生。
  chu: 张若虚《春江花月夜》

# ── 器用 ─────────────────────────────────────────────────
- zi: 爐
  py: lú
  shi: 从火，盧声。
  yi: 火炉。炉有炭火，为冬夜之暖，亦为煎茶之器。
  ju: 绿蚁新醅酒，红泥小火炉。
  chu: 白居易《问刘十九》

- zi: 盞
  py: zhǎn
  shi: 从皿，戔声。皿为器，戔示其小。
  yi: 小杯。盏小则酒浅，故「一盏」常含惜意。
  ju: 三杯两盏淡酒，怎敌他、晚来风急。
  chu: 李清照《声声慢》

- zi: 案
  py: àn
  shi: 从木，安声。本指有足的食器，后为几案。
  yi: 几案；又指文书卷宗。
  ju: 妻为具食，不敢于鸿前仰视，举案齐眉。
  chu: 《后汉书·梁鸿传》

- zi: 鏡
  py: jìng
  shi: 从金，竟声。古镜以铜为之，故从金。
  yi: 镜子。镜能照形而不能照心，故有「镜鉴」之义。
  ju: 以铜为镜，可以正衣冠；以古为镜，可以知兴替。
  chu: 《旧唐书·魏徵传》

# ── 心性 ─────────────────────────────────────────────────
- zi: 誠
  py: chéng
  shi: 从言，成声。言而成实曰诚。
  yi: 真实无妄。诚为天之道，思诚为人之道。
  ju: 诚者，天之道也；思诚者，人之道也。
  chu: 《孟子·离娄上》

- zi: 敬
  py: jìng
  shi: 从攴，苟声。攴为戒敕之意。
  yi: 恭敬、慎重。敬为礼之本，无事而敬，谓之主敬。
  ju: 敬鬼神而远之。
  chu: 《论语·雍也》

- zi: 慎
  py: shèn
  shi: 从心，真声。
  yi: 谨慎。慎在几微处见功夫，故曰「慎独」。
  ju: 慎终追远，民德归厚矣。
  chu: 《论语·学而》

- zi: 獨
  py: dú
  shi: 从犬，蜀声。犬好斗，独行则安，故从犬。
  yi: 单独。君子慎其独，谓无人监督时亦不逾矩。
  ju: 莫见乎隐，莫显乎微，故君子慎其独也。
  chu: 《礼记·中庸》

- zi: 恥
  py: chǐ
  shi: 从心，耳声。
  yi: 羞耻。耻为人之底线，无耻则无所不为。
  ju: 行己有耻。
  chu: 《论语·子路》

- zi: 勇
  py: yǒng
  shi: 从力，甬声。
  yi: 勇气。勇而无义则为乱，故勇须以义节制。
  ju: 知耻近乎勇。
  chu: 《礼记·中庸》

- zi: 恕
  py: shù
  shi: 从心，如声。如者，如其心也。
  yi: 推己及人。恕者，以己之心度人之心。
  ju: 其恕乎！己所不欲，勿施于人。
  chu: 《论语·卫灵公》

- zi: 讓
  py: ràng
  shi: 从言，襄声。
  yi: 谦让。让为礼之实，然当仁则不让。
  ju: 当仁不让于师。
  chu: 《论语·卫灵公》

- zi: 溫
  py: wēn
  shi: 从水，昷声。本指水之微暖。
  yi: 温和。温故知新，谓于旧学中得新意。
  ju: 温故而知新，可以为师矣。
  chu: 《论语·为政》

- zi: 習
  py: xí
  shi: 从羽，白声。本指雏鸟数飞。
  yi: 练习、熟习。习者，鸟数飞而不已之谓。
  ju: 性相近也，习相远也。
  chu: 《论语·阳货》

- zi: 思
  py: sī
  shi: 从心，囟声。囟为脑门，思兼心与脑。
  yi: 思考。思无邪，为诗之要，亦为学之始。
  ju: 诗三百，一言以蔽之，曰：思无邪。
  chu: 《论语·为政》

# ── 情事 ─────────────────────────────────────────────────
- zi: 別
  py: bié
  shi: 从冎从刀，本义为分解，引申为离别。
  yi: 分离。别易会难，故古人重别。
  ju: 相见时难别亦难，东风无力百花残。
  chu: 李商隐《无题》

- zi: 歸
  py: guī
  shi: 从止，婦省。止为足，示有所往而归。
  yi: 返回。归为人之所向，故「归田」「归隐」皆取其返。
  ju: 式微式微，胡不归？
  chu: 《诗经·邶风·式微》

- zi: 愁
  py: chóu
  shi: 从心，秋声。秋气肃杀，人心易感，故愁从秋。
  yi: 忧愁。愁无形，诗人多以水、以雨、以丝喻之。
  ju: 问君能有几多愁？恰似一江春水向东流。
  chu: 李煜《虞美人》

- zi: 閒
  py: xián
  shi: 从门从月。门中有月，见其静。
  yi: 闲暇。闲非无事，乃心有余地。
  ju: 人闲桂花落，夜静春山空。
  chu: 王维《鸟鸣涧》

- zi: 醉
  py: zuì
  shi: 从酉，卒声。酉为酒器。
  yi: 酒酣。醉乡可暂忘忧，故文人多借醉言志。
  ju: 醉里挑灯看剑，梦回吹角连营。
  chu: 辛弃疾《破阵子》

- zi: 遊
  py: yóu
  shi: 从辵，斿声。辵为行走，斿为旗之流。
  yi: 游历。游有二义：身游山水，心游物外。
  ju: 父母在，不远游，游必有方。
  chu: 《论语·里仁》

- zi: 望
  py: wàng
  shi: 会意。从亡从月，人立而望月。
  yi: 远看；又为盼望。望字从月，思乡怀人皆寄于月。
  ju: 举头望明月，低头思故乡。
  chu: 李白《静夜思》

# ── 日月节候 ─────────────────────────────────────────────
- zi: 元
  py: yuán
  shi: 从一从兀。一为始，兀为高。
  yi: 开始、根本。元旦、元日，皆取岁首之义。
  ju: 元者，善之长也。
  chu: 《周易·乾·文言》

- zi: 旦
  py: dàn
  shi: 会意。日在一上，一为地平线，示日出地上。
  yi: 天明。旦为一夜之终、一日之始。
  ju: 吾枕戈待旦，志枭逆虏。
  chu: 《晋书·刘琨传》

- zi: 宵
  py: xiāo
  shi: 从宀，肖声。宀为屋，夜居屋中。
  yi: 夜晚。元宵、春宵，皆言夜之可贵。
  ju: 春宵一刻值千金，花有清香月有阴。
  chu: 苏轼《春宵》

- zi: 晝
  py: zhòu
  shi: 从日，畫省声。日之界画为昼。
  yi: 白天。昼夜相代，古人以昼卜夜。
  ju: 昼出耘田夜绩麻，村庄儿女各当家。
  chu: 范成大《四时田园杂兴》

- zi: 夜
  py: yè
  shi: 从夕，亦省声。夕为月半见。
  yi: 夜晚。夜色可掩形，故多藏思念与壮志。
  ju: 夜阑卧听风吹雨，铁马冰河入梦来。
  chu: 陆游《十一月四日风雨大作》

- zi: 寒
  py: hán
  shi: 会意。人在宀下，以草荐覆之，下有冰。
  yi: 寒冷。寒为岁之末气，亦为士之节操。
  ju: 日暮苍山远，天寒白屋贫。
  chu: 刘长卿《逢雪宿芙蓉山主人》

- zi: 暑
  py: shǔ
  shi: 从日，者声。日为热之源，者示其盛。
  yi: 炎热。暑为夏之气，小暑大暑，以次递进。
  ju: 寒来暑往，秋收冬藏。
  chu: 《千字文》

# ── 羽族 ─────────────────────────────────────────────────
- zi: 雁
  py: yàn
  shi: 从隹，厂声。隹为短尾鸟。
  yi: 大雁。雁行有序，古以雁为礼，取其不失时、不乱序。
  ju: 塞下秋来风景异，衡阳雁去无留意。
  chu: 范仲淹《渔家傲·秋思》

- zi: 燕
  py: yàn
  shi: 象形。象燕展翅之形，尾分如剪。
  yi: 燕子。燕来则春，燕去则秋，故为时序之信。
  ju: 旧时王谢堂前燕，飞入寻常百姓家。
  chu: 刘禹锡《乌衣巷》
