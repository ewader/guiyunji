# 今日一字 · 字课
# 结构：zi 字 / py 拼音 / shi 字源 / yi 释义 / ju 用例 / chu 出处
# 按「一年中的第几天」轮换，同日同字，人我一如

- zi: 雲
  py: yún
  shi: 初文作「云」，象云气回旋之形；后加雨为「雲」，从雨、云声。
  yi: 山川之气蒸腾而上，聚而为云。古人观云以知雨，云色即天时。
  ju: 山中何所有，岭上多白云。
  chu: 陶弘景《诏问山中何所有赋诗以答》

- zi: 山
  py: shān
  shi: 象形。三峰并峙，中高旁低。
  yi: 地面高起之处。古人以山为骨，五岳各镇一方，山即疆土之界。
  ju: 空山不见人，但闻人语响。
  chu: 王维《鹿柴》

- zi: 水
  py: shuǐ
  shi: 象形。中为水流，两旁为岸，四点如浪。
  yi: 河流。引申为一切润下之物，与火相对，为五行之首。
  ju: 上善若水，水善利万物而不争。
  chu: 《老子·第八章》

- zi: 木
  py: mù
  shi: 象形。上出者为枝，下入者为根，一竖为干。
  yi: 树。五行之一，主生发；引申为质朴、木讷。
  ju: 伐木丁丁，鸟鸣嘤嘤。
  chu: 《诗经·小雅·伐木》

- zi: 竹
  py: zhú
  shi: 象形。两竿并生，叶垂而下，形如「个」字。
  yi: 竹子。中空有节，故君子取之：虚其心，守其节。
  ju: 宁可食无肉，不可居无竹。
  chu: 苏轼《于潜僧绿筠轩》

- zi: 茶
  py: chá
  shi: 本作「荼」，唐时减一笔为「茶」。从艸，余声。
  yi: 茶树。自陆羽著经，饮茶由药入道，成一门生活之学。
  ju: 茶者，南方之嘉木也。
  chu: 陆羽《茶经·一之源》

- zi: 書
  py: shū
  shi: 从聿从者。聿，手执笔也；者，声兼义。
  yi: 书写；又指所写之册。字在竹帛为书，在纸为卷。
  ju: 读书破万卷，下笔如有神。
  chu: 杜甫《奉赠韦左丞丈二十二韵》

- zi: 墨
  py: mò
  shi: 会意。从黑、从土——以土之烟炱为黑，和胶成块。
  yi: 书写绘画的黑色颜料。墨分五色，浓淡干湿焦，一墨可当七彩。
  ju: 宋元君将画图，众史皆至，受揖而立，舐笔和墨。
  chu: 《庄子·田子方》

- zi: 紙
  py: zhǐ
  shi: 从糸，氏声。本指漂洗丝絮时沉于竹席上的絮渣，故从糸。
  yi: 蔡伦以树肤、麻头、敝布、鱼网造纸，自此竹帛让位，文脉得以广传。
  ju: 于是豪贵之家竞相传写，洛阳为之纸贵。
  chu: 《晋书·左思传》

- zi: 琴
  py: qín
  shi: 象形兼形声。上象弦轸，下象琴身。本作「琹」。
  yi: 七弦之器。古人以琴正心，非为娱人，乃为娱己。
  ju: 窈窕淑女，琴瑟友之。
  chu: 《诗经·周南·关雎》

- zi: 春
  py: chūn
  shi: 会意。从艸、从日、从屯——日暖草生，屯然破土。
  yi: 四时之首。春者，蠢也，万物蠢动而出。
  ju: 春日载阳，有鸣仓庚。
  chu: 《诗经·豳风·七月》

- zi: 秋
  py: qiū
  shi: 象形。上为禾穗下垂，下为根，本指谷熟。
  yi: 谷熟曰秋，故秋为收成之季；又引申为年岁、为肃杀。
  ju: 自古逢秋悲寂寥，我言秋日胜春朝。
  chu: 刘禹锡《秋词》

- zi: 月
  py: yuè
  shi: 象形。象缺月之形，中一笔为月魄。
  yi: 月亮。月有盈亏，故古人以月纪时，朔望晦弦，一月之序生焉。
  ju: 明月松间照，清泉石上流。
  chu: 王维《山居秋暝》

- zi: 雪
  py: xuě
  shi: 从雨，彗声。凝雨而为花者——雨之下，遇寒则结。
  yi: 空中降下的雪花。雪能覆物，亦能照夜，故文人多取其为清绝之象。
  ju: 孤舟蓑笠翁，独钓寒江雪。
  chu: 柳宗元《江雪》

- zi: 風
  py: fēng
  shi: 从虫，凡声。古人谓风动虫生，故字从虫。
  yi: 空气流行。风有八方，各以其时，古人候风以定农事、辨吉凶。
  ju: 风雨如晦，鸡鸣不已。
  chu: 《诗经·郑风·风雨》

- zi: 花
  py: huā
  shi: 从艸，化声。六朝以前多作「華」，花为后起之本字。
  yi: 草木之花。华而后实，故花为草木之盛，亦为人事之盛。
  ju: 云想衣裳花想容，春风拂槛露华浓。
  chu: 李白《清平调》

- zi: 石
  py: shí
  shi: 象形。厂为山崖，口为崖下之石。
  yi: 岩石。石为山之骨，可为砚、为碑、为印，文人之事多赖之。
  ju: 乱石穿空，惊涛拍岸，卷起千堆雪。
  chu: 苏轼《念奴娇·赤壁怀古》

- zi: 心
  py: xīn
  shi: 象形。象心脏之形，中一点为心房。
  yi: 心为思之官。古人以心统性情，故一切念头皆自心出。
  ju: 心之官则思，思则得之，不思则不得也。
  chu: 《孟子·告子上》

- zi: 靜
  py: jìng
  shi: 从青，争声。青为东方之色，主生而含静气。
  yi: 安静、止息。静非无声，乃心不随声转。
  ju: 蝉噪林逾静，鸟鸣山更幽。
  chu: 王籍《入若耶溪》

- zi: 和
  py: hé
  shi: 从口，禾声。口相应曰和，如歌者相答。
  yi: 声音相和；引申为调和、平和。五味相济曰和，五声相谐亦曰和。
  ju: 礼之用，和为贵。
  chu: 《论语·学而》

- zi: 中
  py: zhōng
  shi: 象形。象旗杆立于中，上下有旒，以表中央。
  yi: 中间、中正。不偏不倚之谓中，故《中庸》以中为天下之达道。
  ju: 人心惟危，道心惟微，惟精惟一，允执厥中。
  chu: 《尚书·大禹谟》

- zi: 道
  py: dào
  shi: 从辵、从首。辵为行走，首为所向——人所由之路。
  yi: 道路；引申为道理、规律。路有定迹，道无定形，故曰「道可道，非常道」。
  ju: 道可道，非常道；名可名，非常名。
  chu: 《老子·第一章》

- zi: 時
  py: shí
  shi: 从日，寺声。日之行而有四时，故字从日。
  yi: 季节、时辰。时为天之所命，故君子「时至而事起」。
  ju: 学而时习之，不亦说乎。
  chu: 《论语·学而》

- zi: 節
  py: jié
  shi: 从竹，即声。竹约曰节——竹中空而外有节，分段而生。
  yi: 竹节；引申为节令、节度。二十四节气之名，即取竹节分段之义。
  ju: 节以制度，不伤财，不害民。
  chu: 《周易·节卦·彖传》
