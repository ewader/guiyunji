<header class="site-header" id="siteHeader">
  <div class="header-inner container">
    <a href="{{ "/" | relURL }}" class="header-logo">
      <img class="logo-mark" src="{{ "images/logo-mark.png" | relURL }}" alt="" width="66" height="52">
      <span class="logo-textwrap">
        <span class="logo-text">{{ .Site.Title }}</span>
        <span class="logo-sub">GUIYUN&nbsp;COLLECTION</span>
      </span>
    </a>

    <nav class="header-nav" id="headerNav">
      {{ $currentURL := .RelPermalink }}
      {{ range .Site.Menus.main }}
        {{ $isActive := or (eq $currentURL .URL) (eq $currentURL (printf "%s/" .URL)) (and (ne .URL "/") (hasPrefix $currentURL .URL)) }}
        <a href="{{ .URL }}" class="nav-link{{ if $isActive }} active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>

    <div class="header-actions">
      <a class="icon-link" href="{{ "index.xml" | relURL }}" aria-label="订阅更新" title="订阅更新">
        <svg viewBox="0 0 18 18" aria-hidden="true">
          <circle cx="4" cy="14" r="1.6" fill="currentColor" stroke="none"></circle>
          <path d="M3.4 9.2a5.4 5.4 0 0 1 5.4 5.4"></path>
          <path d="M3.4 4.4a10.2 10.2 0 0 1 10.2 10.2"></path>
        </svg>
      </a>
      <span class="sep"></span>
      <a class="subscribe" href="{{ "index.xml" | relURL }}">订阅</a>
      <button class="header-toggle" id="headerToggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="headerNav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
